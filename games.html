<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ChillChat - Games</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <header class="header">
        <button onclick="goHome()">←</button>
        <h1>🎮 Games</h1>
        <p>Play & have fun</p>
    </header>

    <main>

        <div class="welcome">
            <h2>Game Zone 🎮</h2>
            <p>Choose a game and start playing!</p>
        </div>

        <div class="game-grid">

            <div class="game-card" onclick="startGame('Number Guess')">
                <div class="game-icon">🔢</div>
                <h3>Number Guess</h3>
                <p>Guess the secret number</p>
                <button>Play Now</button>
            </div>

            <div class="game-card" onclick="startGame('Rock Paper Scissors')">
                <div class="game-icon">✊</div>
                <h3>Rock Paper Scissors</h3>
                <p>Beat the computer</p>
                <button>Play Now</button>
            </div>

            <div class="game-card" onclick="startGame('Tic Tac Toe')">
                <div class="game-icon">⭕</div>
                <h3>Tic Tac Toe</h3>
                <p>Classic X & O game</p>
                <button>Play Now</button>
            </div>

            <div class="game-card" onclick="startGame('Memory Game')">
                <div class="game-icon">🧠</div>
                <h3>Memory Game</h3>
                <p>Test your memory</p>
                <button>Play Now</button>
            </div>

        </div>

        <div id="gameArea" class="game-area">
            <h2 id="gameTitle">Select a game 🎮</h2>
            <p id="gameMessage">Choose any game above to start.</p>
        </div>

    </main>

</div>

<script src="games.js"></script>

</body>
</html>
